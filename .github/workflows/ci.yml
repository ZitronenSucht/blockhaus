name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python kompilieren
        run: python -m compileall -q blockhaus tests
      - name: Tests
        run: python -m unittest discover -s tests -v
        timeout-minutes: 15

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: JavaScript-Syntax prüfen
        run: |
          node --check blockhaus/static/app.js
          node --check blockhaus/static/i18n.js
      - name: Alle Texte übersetzt?
        run: python tools/extract_strings.py --check > /dev/null
      - name: Übersetzung im Browser (jsdom)
        working-directory: tests/js
        run: |
          npm init -y > /dev/null
          npm install --silent jsdom@25.0.1
          node i18n.test.mjs
